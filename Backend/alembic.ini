# MindEase-AI Backend Alembic Configuration
#
# PURPOSE: Convenience alias so that `alembic` commands work when invoked from
# the Backend/ directory.  The canonical config lives at the repository root
# (../alembic.ini); both files point at the same migration scripts folder:
#   Backend/alembic/versions/
#
# DATABASE URL NOTE: The sqlalchemy.url below is a PLACEHOLDER and is NEVER
# used at runtime.  Backend/alembic/env.py always overrides it with the
# absolute path produced by Backend/config.py (settings.DATABASE_URL), so the
# effective database is always:
#   sqlite:///<absolute-path-to-Backend>/mindease.db
# regardless of which working directory alembic is invoked from.
#
# If you need to change the database, set the DATABASE_URL environment variable
# or edit Backend/config.py — do NOT rely on this sqlalchemy.url line.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = . ..
path_separator = os
sqlalchemy.url = sqlite:///./mindease.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
